[project]
name = "myo-sim"
version = "0.2.0"
description = "MuJoCo musculoskeletal model definitions for MyoSuite"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scipy>=1.10",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.0",
    "ruff>=0.4",
    "pre-commit>=3.0",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_sims.py"]

[tool.ruff]
line-length = 128

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
