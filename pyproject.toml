[project]
name = "myo-sim"
version = "0.2.1"
description = "MuJoCo musculoskeletal model definitions for MyoSuite"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache 2.0" }
authors = [
    { name = "Vittorio Caggiano", email = "caggiano@gmail.com" },
    { name = "Huiyi Wang", email = "huiyi.wang@mail.mcgill.ca" },
]
dependencies = [
    "mujoco>=3.4",
    "numpy>=1.24",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.0",
    "ruff>=0.4",
    "pre-commit>=3.0",
    # Used only by the muscle-analysis / symmetry scripts under tests/.
    "matplotlib>=3.7",
    "scipy>=1.10",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["myo_sim*"]

[tool.setuptools.package-data]
myo_sim = [
    "models/*",
    "models/**/*",
    "build/*",
    "build/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.ruff]
line-length = 128
extend-exclude = ["sandbox", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["myo_sim"]
