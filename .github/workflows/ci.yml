name: CI

on:
  push:
    branches: [main, mm_refactor_mjspec]
  pull_request:
    branches: [main, mm_refactor_mjspec]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: uv sync --dev

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check formatting with ruff
        run: uv run ruff format --check .

  generated-xml:
    runs-on: ubuntu-latest
    needs: lint
    # Write permission needed to push auto-committed artefacts back to the branch.
    # Fork PRs have read-only tokens; the job falls back to failing with instructions.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch the full ref so we can push back to the PR branch.
          ref: ${{ github.head_ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"

      - name: Install system dependencies for MuJoCo
        run: sudo apt-get install -y libgl1 libglib2.0-0 libosmesa6

      - name: Install package
        run: uv sync --dev

      - name: Regenerate committed XML artefacts
        run: uv run python -m myo_sim.build.compose --generate

      - name: Commit regenerated XML if it changed
        run: |
          if ! git diff --exit-code myo_sim/models/hand/myohand_r.xml; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add myo_sim/models/hand/myohand_r.xml
            git commit -m "chore: regenerate myohand_r.xml from arm XML [skip ci]"
            git push || {
              echo "::error::myohand_r.xml is out of sync and could not be auto-committed (fork PR?)."
              echo "::error::Run locally: uv run python -m myo_sim.build.compose --generate"
              exit 1
            }
          fi

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"

      - name: Install system dependencies for MuJoCo
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libosmesa6

      - name: Install package
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest tests/ -x -n auto --ignore=tests/test_equivalence.py --ignore=tests/test_bimanual_muscle_symmetry.py -q
