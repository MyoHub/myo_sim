name: CI

on:
  push:
    branches: [main, mm_refactor_mjspec]
  pull_request:
    branches: [main, mm_refactor_mjspec]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: uv sync --dev

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check formatting with ruff
        run: uv run ruff format --check .

  generated-xml:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"

      - name: Install system dependencies for MuJoCo
        run: sudo apt-get install -y libgl1 libglib2.0-0 libosmesa6

      - name: Install package
        run: uv sync --dev

      - name: Regenerate committed XML artefacts
        run: uv run python -m myo_sim.build.compose --generate

      - name: Fail if generated XML is out of sync with arm source
        run: |
          if ! git diff --exit-code myo_sim/models/hand/myohand_r.xml; then
            echo "::error::myo_sim/models/hand/myohand_r.xml is out of sync with the arm XML."
            echo "::error::Run: uv run python -m myo_sim.build.compose --generate"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"

      - name: Install system dependencies for MuJoCo
        run: sudo apt-get install -y libgl1 libglib2.0-0 libosmesa6

      - name: Install package
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest tests/ -x -n auto --ignore=tests/test_equivalence.py --ignore=tests/test_bimanual_muscle_symmetry.py -q
