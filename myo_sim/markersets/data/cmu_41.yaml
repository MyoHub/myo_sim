name: cmu_41
description: CMU Graphics Lab 41-marker set (Vicon 512 layout plus forearm and shank markers). Names as in the CMU C3D files; the
  placement guide's figure labels the forearm and shank markers RARM/LARM and RLEG/LLEG. The finger markers are asymmetric (right
  index, left ring finger).
sources:
- 'CMU marker placement guide: http://mocap.cs.cmu.edu/markerPlacementGuide.pdf'
- 'CMU Graphics Lab Motion Capture Database: http://mocap.cs.cmu.edu/faqs.php'
markers:
