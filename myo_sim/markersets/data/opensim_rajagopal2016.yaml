name: opensim_rajagopal2016
description: Scaling marker set of the OpenSim Rajagopal 2016 full-body model (walking pipeline), copied in the model's body frames,
  which equal myo_sim's for the pelvis, legs, torso and arm bones. Includes the virtual joint-centre and ground-projection markers.
sources:
- 'OpenSim models, Rajagopal pipeline: https://github.com/opensim-org/opensim-models/blob/master/Pipelines/Rajagopal/Scale/markerset_walk_preScale.xml'
- Rajagopal A et al. (2016) Full-body musculoskeletal model for muscle-driven simulation of human gait. IEEE Trans Biomed Eng 63:2068-2079
