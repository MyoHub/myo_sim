name: opensim_gait2392
description: Scaling marker set of the OpenSim gait2392 model, copied in the model's body frames (gait2392 and Rajagopal share the
  Delp lower-limb frames; the torso frame differs slightly, so torso markers are approximate).
sources:
- 'OpenSim models, gait2392 pipeline: https://github.com/opensim-org/opensim-models/blob/master/Pipelines/Gait2392_Simbody/gait2392_Scale_MarkerSet.xml'
- 'Delp SL et al. (1990) An interactive graphics-based model of the lower extremity. IEEE Trans Biomed Eng 37:757-767 (gait2392 model
  credits: CC BY 3.0)'
