name: bath_running
description: Marker set of the University of Bath running dataset (dynamic and static-trial markers; treadmill corner markers omitted).
  Positions of cluster, foot and static-only markers are medians over the 50 static trials (both sides), mapped into the model by
  per-segment similarity fits on the epicondyle, malleolus, calcaneus and fifth-metatarsal markers.
